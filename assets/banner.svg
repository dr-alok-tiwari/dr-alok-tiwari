<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.30" stop-color="#0F172A"/>
      <stop offset="0.58" stop-color="#1E3A8A"/>
      <stop offset="0.80" stop-color="#0891B2"/>
      <stop offset="1.00" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1350 100) scale(300)">
      <stop stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 380) scale(220)">
      <stop stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="80" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <rect width="1600" height="480" fill="url(#glowR)"/>
  <rect width="1600" height="480" fill="url(#glowL)"/>

  <!-- Bottom wave decoration -->
  <path d="M0 390 C200 340 380 430 640 375 C920 315 1130 420 1600 330 L1600 480 L0 480 Z" fill="#FFFFFF" fill-opacity="0.04"/>
  <path d="M0 418 C240 365 430 468 700 408 C1010 342 1230 458 1600 378" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Decorative circles top-right -->
  <circle cx="1400" cy="80" r="110" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="1530" cy="210" r="58" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="1220" cy="290" r="72" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1500" cy="72" r="14" fill="#FCD34D" fill-opacity="0.90"/>
  <circle cx="1348" cy="238" r="9" fill="#22D3EE" fill-opacity="0.88"/>
  <circle cx="1130" cy="92" r="7" fill="#A78BFA" fill-opacity="0.92"/>

  <!-- Gold accent lines (left) -->
  <line x1="80" y1="102" x2="360" y2="102" stroke="url(#goldLine)" stroke-width="9" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="220" y2="120" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- NAME – large, clear, no clipping -->
  <text x="80" y="196" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1">Dr. Alok Tiwari</text>

  <!-- Title line -->
  <text x="84" y="248" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600">Assistant Professor · Big Data Analytics · IIT-BHU PhD</text>

  <!-- Keyword line — tighter font, safe zone -->
  <text x="84" y="292" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Healthcare AI  ·  Medical Imaging  ·  MLOps  ·  XAI  ·  GenAI  ·  Teaching Innovation</text>

  <!-- Pill badges — horizontal, well-spaced, no overlap -->
  <rect x="80" y="326" width="172" height="44" rx="22" fill="#06B6D4" fill-opacity="0.16" stroke="#67E8F9" stroke-opacity="0.70" stroke-width="1.2"/>
  <text x="166" y="354" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AI for Impact</text>

  <rect x="268" y="326" width="196" height="44" rx="22" fill="#8B5CF6" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.60" stroke-width="1.2"/>
  <text x="366" y="354" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Healthcare Analytics</text>

  <rect x="480" y="326" width="178" height="44" rx="22" fill="#F59E0B" fill-opacity="0.16" stroke="#FCD34D" stroke-opacity="0.70" stroke-width="1.2"/>
  <text x="569" y="354" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Research Driven</text>

  <!-- Stats card – right panel, well within 1600px width -->
  <rect x="1040" y="120" width="320" height="228" rx="24" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="1200" y="166" text-anchor="middle" fill="#FCD34D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">CORE DOMAINS</text>
  <line x1="1060" y1="180" x2="1340" y2="180" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  <text x="1060" y="214" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">01  Healthcare AI</text>
  <text x="1060" y="248" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">02  Machine Learning</text>
  <text x="1060" y="282" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">03  Medical Imaging</text>
  <text x="1060" y="316" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">04  Data Analytics</text>

  <!-- Bottom dot row -->
  <circle cx="1020" cy="376" r="5" fill="#22D3EE"/>
  <circle cx="1044" cy="376" r="5" fill="#A78BFA"/>
  <circle cx="1068" cy="376" r="5" fill="#FCD34D"/>
  <line x1="1094" y1="376" x2="1348" y2="376" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round"/>
</svg>
